<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Performance Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --yellow: #FFE500;
      --black: #111111;
      --ink: #1a1a1a;
      --ink2: #2d2d2d;
      --slate: #4a4a4a;
      --mid: #7a7a7a;
      --border: #e0e0e0;
      --border-light: #f0f0f0;
      --bg: #f4f4f2;
      --surface: #ffffff;
      --surface2: #fafaf8;
      --fd-bg: #161616;
      --fd-border: #2a2a2a;
      --fd-input: #1f1f1f;
      --fd-text: #f0f0f0;
      --fd-label: #999;
      --font-d: 'Bebas Neue', sans-serif;
      --font-b: 'DM Sans', sans-serif;
      --font-m: 'DM Mono', monospace;
      --r: 6px; --rl: 12px;
      --sh: 0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-b); background: var(--bg); color: var(--ink); min-height: 100vh; }

    /* HEADER */
    .hdr {
      background: var(--black); border-bottom: 3px solid var(--yellow);
      padding: 0 1.75rem; display: flex; align-items: center; gap: 1.25rem;
      height: 58px; position: sticky; top: 0; z-index: 200;
    }
    .hdr img { height: 34px; width: auto; object-fit: contain; }
    .hdr-t { flex: 1; }
    .hdr-t h1 { font-family: var(--font-d); font-size: 24px; letter-spacing: .06em; color: var(--yellow); line-height: 1; }
    .hdr-t p { font-size: 10px; color: #666; letter-spacing: .1em; text-transform: uppercase; margin-top: 1px; }
    .spill {
      display: flex; align-items: center; gap: 7px;
      background: #1e1e1e; border: 1px solid #2a2a2a;
      border-radius: 20px; padding: 4px 12px;
      font-family: var(--font-m); font-size: 11px; color: #777;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #3a3a3a; }
    .dot.live { background: #22c55e; box-shadow: 0 0 5px #22c55e88; }
    .dot.loading { background: var(--yellow); animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }
    .rfbtn {
      background: transparent; border: 1px solid #333; color: #777;
      padding: 5px 12px; font-family: var(--font-b); font-size: 12px; font-weight: 500;
      cursor: pointer; border-radius: var(--r); transition: all .15s;
    }
    .rfbtn:hover { border-color: var(--yellow); color: var(--yellow); }

    /* APP LAYOUT */
    .app { display: flex; min-height: calc(100vh - 58px); }

    /* SIDEBAR */
    .sb {
      width: 250px; flex-shrink: 0;
      background: var(--fd-bg);
      border-right: 1px solid #1e1e1e;
      padding: 1.25rem .9rem 2rem;
      overflow-y: auto;
      position: sticky; top: 58px;
      height: calc(100vh - 58px);
      scrollbar-width: thin; scrollbar-color: #2a2a2a transparent;
    }
    .sb-sec { margin-bottom: 1.4rem; }
    .sb-hd {
      font-family: var(--font-d); font-size: 13px; letter-spacing: .14em;
      color: var(--yellow); padding-bottom: .35rem;
      border-bottom: 1px solid #252525; margin-bottom: .7rem;
    }
    .sb-lbl { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--fd-label); margin-bottom: 4px; display: block; }
    .sb-sel {
      width: 100%; background: var(--fd-input); border: 1px solid var(--fd-border);
      border-radius: var(--r); color: var(--fd-text); font-family: var(--font-b);
      font-size: 13px; padding: 7px 9px; cursor: pointer; appearance: none; margin-bottom: .7rem;
    }
    .sb-sel:focus { outline: none; border-color: var(--yellow); }
    .sb-sel option { background: #1f1f1f; }

    /* Split dropdown */
    .sd-wrap { position: relative; margin-bottom: .7rem; }
    .sd-inp {
      width: 100%; background: var(--fd-input); border: 1px solid var(--fd-border);
      border-radius: var(--r); color: var(--fd-text); font-family: var(--font-b);
      font-size: 13px; padding: 7px 26px 7px 9px; cursor: pointer;
    }
    .sd-inp:focus { outline: none; border-color: var(--yellow); }
    .sd-arr { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #555; font-size: 10px; pointer-events: none; }
    .sd-list {
      display: none; position: absolute; top: calc(100% + 3px); left: 0; right: 0;
      background: #1e1e1e; border: 1px solid var(--yellow);
      border-radius: var(--r); max-height: 200px; overflow-y: auto;
      z-index: 300; scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .sd-list.open { display: block; }
    .sd-item {
      padding: 7px 9px; font-size: 12px; cursor: pointer;
      border-bottom: 1px solid #252525; color: var(--fd-text); transition: background .1s;
    }
    .sd-item:last-child { border-bottom: none; }
    .sd-item:hover, .sd-item.active { background: #252525; }
    .sd-item.active { color: var(--yellow); }

    /* Dual range */
    .dr-wrap { position: relative; margin-bottom: .5rem; }
    .dr-track { height: 4px; background: #2a2a2a; border-radius: 2px; margin: 8px 5px 3px; position: relative; }
    .dr-fill { position: absolute; height: 100%; background: var(--yellow); border-radius: 2px; }
    .dr-wrap input[type=range] {
      position: absolute; top: 0; left: 0; width: 100%;
      -webkit-appearance: none; appearance: none;
      background: transparent; border: none; padding: 0; pointer-events: none; height: 20px;
    }
    .dr-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--yellow); border: 2px solid var(--black);
      cursor: pointer; pointer-events: all;
    }
    .dr-wrap input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--yellow); border: 2px solid var(--black); cursor: pointer; pointer-events: all;
    }
    .dr-lbl { font-family: var(--font-m); font-size: 11px; color: var(--fd-label); text-align: center; margin-top: 4px; }

    /* Check lists */
    .ck-ctrl { display: flex; gap: 5px; margin-bottom: 5px; }
    .ck-cbtn {
      font-size: 10px; padding: 2px 8px; background: transparent;
      border: 1px solid #333; border-radius: 3px; color: #777;
      cursor: pointer; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; transition: all .12s;
    }
    .ck-cbtn:hover { border-color: var(--yellow); color: var(--yellow); }
    .ck-srch {
      width: 100%; background: var(--fd-input); border: 1px solid var(--fd-border);
      border-radius: var(--r); color: var(--fd-text); font-family: var(--font-b);
      font-size: 12px; padding: 5px 8px; margin-bottom: 5px;
    }
    .ck-srch:focus { outline: none; border-color: var(--yellow); }
    .ck-list {
      max-height: 150px; overflow-y: auto; border: 1px solid var(--fd-border);
      border-radius: var(--r); scrollbar-width: thin; scrollbar-color: #2a2a2a transparent;
    }
    .ck-item {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 8px; border-bottom: 1px solid #1e1e1e;
      cursor: pointer; font-size: 12px; color: var(--fd-text); transition: background .1s;
    }
    .ck-item:last-child { border-bottom: none; }
    .ck-item:hover { background: #1e1e1e; }
    .ck-item input[type=checkbox] { accent-color: var(--yellow); flex-shrink: 0; }

    /* MAIN */
    .main { flex: 1; padding: 1.5rem 1.75rem 3rem; min-width: 0; }

    /* TAB BAR */
    .tabs {
      display: flex; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--rl);
      overflow: hidden; margin-bottom: 1.5rem; box-shadow: var(--sh);
    }
    .tbtn {
      flex: 1; padding: 10px 12px;
      font-family: var(--font-b); font-size: 13px; font-weight: 600;
      background: transparent; color: var(--mid);
      border: none; border-right: 1px solid var(--border);
      cursor: pointer; transition: all .15s;
    }
    .tbtn:last-child { border-right: none; }
    .tbtn:hover { background: var(--surface2); color: var(--ink); }
    .tbtn.on { background: var(--yellow); color: var(--black); font-weight: 700; }

    /* VIEW HEADING */
    .vhd { display: flex; align-items: baseline; gap: 12px; margin-bottom: 1.25rem; }
    .vhd h2 { font-family: var(--font-d); font-size: 44px; letter-spacing: .04em; color: var(--ink); line-height: 1; }
    .vhd span { font-size: 13px; color: var(--mid); }

    /* SUMMARY */
    .sum-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .sc {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--rl); padding: .85rem 1rem;
      box-shadow: var(--sh); position: relative; overflow: hidden;
    }
    .sc::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background:var(--yellow); }
    .sc-lbl { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); margin-bottom: 5px; }
    .sc-val { font-family: var(--font-d); font-size: 30px; color: var(--ink); line-height: 1; }
    .sc-sub { font-size: 11px; color: var(--mid); margin-top: 3px; }

    /* PANEL */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--rl); padding: 1.2rem 1.4rem;
      box-shadow: var(--sh); margin-bottom: 1.2rem;
    }
    .phd { display: flex; align-items: center; justify-content: space-between; margin-bottom: .9rem; }
    .pt { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--mid); }
    .ptag { font-family: var(--font-m); font-size: 11px; color: var(--mid); }
    .cw { position: relative; width: 100%; height: 320px; }
    .leg { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .li { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--slate); }
    .ld { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* EVENT SELECTOR */
    .ev-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .ev-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 500; color: var(--ink);
      transition: border-color .12s;
    }
    .ev-chip:has(input:checked) { border-color: var(--yellow); background: #fffbe0; }
    .ev-chip input { accent-color: var(--yellow); }
    .ev-chip .ev-date { font-size: 10px; color: var(--mid); }
    .ev-chip .ev-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .ev-g { background: #dbeafe; color: #1d4ed8; }
    .ev-t { background: #dcfce7; color: #166534; }

    /* RANK */
    .rr { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-light); }
    .rr:last-child { border-bottom: none; }
    .rn { font-family: var(--font-m); font-size: 11px; color: var(--mid); width: 18px; flex-shrink: 0; }
    .rnm { font-size: 13px; font-weight: 500; color: var(--ink); width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rbw { flex: 1; height: 5px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
    .rb { height: 100%; border-radius: 3px; transition: width .4s ease; }
    .rv { font-family: var(--font-m); font-size: 12px; font-weight: 500; color: var(--ink); min-width: 48px; text-align: right; }

    /* TWO COL */
    .tcol { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    @media(max-width:720px){.tcol{grid-template-columns:1fr}}

    /* H2H */
    .h2r { display: grid; grid-template-columns: 1fr 84px 84px; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--border-light); align-items: center; }
    .h2r:last-child { border-bottom: none; }
    .h2hd { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mid); }
    .h2m { font-size: 12px; color: var(--slate); }
    .h2brow { display: flex; align-items: center; gap: 4px; margin-top: 3px; height: 4px; }
    .h2ba { height: 100%; border-radius: 2px; background: var(--yellow); transition: width .4s; }
    .h2bb { height: 100%; border-radius: 2px; background: var(--ink2); transition: width .4s; }
    .h2v { font-family: var(--font-m); font-size: 13px; font-weight: 500; color: var(--mid); text-align: right; }
    .h2w { color: var(--ink) !important; font-weight: 700 !important; }

    .empty { padding: 2.5rem; text-align: center; font-size: 13px; color: var(--mid); }
    .ei { font-size: 28px; margin-bottom: 8px; opacity: .4; }

    @media(max-width:860px){ .sb { width: 220px; } .main { padding: 1rem; } }
    @media(max-width:600px){ .app { flex-direction: column; } .sb { width: 100%; height: auto; position: static; } }
  </style>
</head>
<body>

<header class="hdr">
  <img src="Logo.png" alt="Club" onerror="this.style.display='none'">
  <div class="hdr-t">
    <h1>GPS PERFORMANCE</h1>
    <p>Catapult · Match &amp; Training Data</p>
  </div>
  <div class="spill">
    <div class="dot loading" id="sDot"></div>
    <span id="sTxt">Loading…</span>
  </div>
  <button class="rfbtn" onclick="loadData()">↻ Refresh</button>
</header>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sb">

    <div class="sb-sec">
      <div class="sb-hd">Session</div>
      <span class="sb-lbl">Split Name</span>
      <div class="sd-wrap" id="sdWrap">
        <input class="sd-inp" id="sdInp" type="text" placeholder="All splits" readonly
          onclick="sdToggle()" onblur="sdClose()">
        <span class="sd-arr">▾</span>
        <div class="sd-list" id="sdList"></div>
      </div>
      <span class="sb-lbl">Metric</span>
      <select class="sb-sel" id="metSel" onchange="onMet()"></select>
    </div>

    <div class="sb-sec">
      <div class="sb-hd">Players</div>
      <div class="ck-ctrl">
        <button class="ck-cbtn" onclick="ckAll('pcb',true)">All</button>
        <button class="ck-cbtn" onclick="ckAll('pcb',false)">None</button>
      </div>
      <input class="ck-srch" type="text" id="pSrch" placeholder="Search players…" oninput="filterP(this.value)">
      <div class="ck-list" id="pList"></div>
    </div>

    <div class="sb-sec">
      <div class="sb-hd">Positions</div>
      <div class="ck-ctrl">
        <button class="ck-cbtn" onclick="ckAll('poscb',true)">All</button>
        <button class="ck-cbtn" onclick="ckAll('poscb',false)">None</button>
      </div>
      <div class="ck-list" id="posList"></div>
    </div>

    <div class="sb-sec">
      <div class="sb-hd">Squad</div>
      <select class="sb-sel" id="sqSel" onchange="go()">
        <option value="">All squads</option>
      </select>
    </div>

    <div class="sb-sec">
      <div class="sb-hd">Minutes Played</div>
      <div class="dr-wrap">
        <div class="dr-track"><div class="dr-fill" id="drFill"></div></div>
        <input type="range" id="drMin" min="0" max="120" value="0" step="1" oninput="onDr()">
        <input type="range" id="drMax" min="0" max="120" value="120" step="1" oninput="onDr()">
      </div>
      <div class="dr-lbl" id="drLbl">0 – 120 min</div>
    </div>

    <div class="sb-sec" id="h2hSec" style="display:none">
      <div class="sb-hd">Head to Head</div>
      <span class="sb-lbl">Player A</span>
      <select class="sb-sel" id="pA" onchange="go()"></select>
      <span class="sb-lbl">Player B</span>
      <select class="sb-sel" id="pB" onchange="go()"></select>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="tabs">
      <button class="tbtn on" onclick="setTab('team',this)">Team</button>
      <button class="tbtn" onclick="setTab('player',this)">Player</button>
      <button class="tbtn" onclick="setTab('tracking',this)">Team Tracking</button>
      <button class="tbtn" onclick="setTab('h2h',this)">Head to Head</button>
    </div>

    <div class="vhd">
      <h2 id="vhd">TEAM</h2>
      <span id="vsub"></span>
    </div>

    <!-- Event selector (tracking only) -->
    <div class="panel" id="evPanel" style="display:none">
      <div class="phd">
        <div class="pt">Select Events</div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="ck-cbtn" onclick="ckAll('ecb',true)" style="border:1px solid var(--border);color:var(--mid)">All</button>
          <button class="ck-cbtn" onclick="ckAll('ecb',false)" style="border:1px solid var(--border);color:var(--mid)">None</button>
        </div>
      </div>
      <input type="text" id="evSrch" placeholder="Search events…" oninput="filterEv(this.value)"
        style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-family:var(--font-b);font-size:13px;margin-bottom:.75rem;background:var(--surface2);color:var(--ink)">
      <div class="ev-grid" id="evGrid"></div>
    </div>

    <div class="sum-row" id="sumCards"></div>

    <div class="panel" id="mainPanel">
      <div class="phd">
        <div class="pt" id="cTitle"></div>
        <div class="ptag" id="cTag"></div>
      </div>
      <div class="leg" id="cLeg"></div>
      <div class="cw" id="cWrap"><canvas id="mc" role="img"></canvas></div>
    </div>

    <div class="panel" id="rkPanel"></div>

    <div class="tcol" id="h2hPanels" style="display:none">
      <div class="panel">
        <div class="phd"><div class="pt">Head to Head</div></div>
        <div id="h2hTbl"></div>
      </div>
      <div class="panel">
        <div class="phd"><div class="pt" id="h2hCTitle">Metrics Comparison</div></div>
        <div class="cw" style="height:280px"><canvas id="h2hC" role="img"></canvas></div>
      </div>
    </div>

  </main>
</div>

<script>
/* ── CONFIG ── */
const SHEET_ID = "1NjflNGpLnBaQfV0NXtILRT7X7Uz7ILMEPrJu5U4R2qc";
const API = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=GPS&gid=1156783603`;
const METRICS = ["Distance (km)","HSR (m)","Sprint Distance (m)","Work Rate (m/min)","Top Speed (km/h)","Hard Accelerations (#)","Hard Decelerations (#)"];
const PAL = ["#FFE500","#e85d04","#3a86ff","#06d6a0","#ff006e","#8338ec","#fb5607","#118ab2","#ef476f","#ffd166","#06d6a0","#073b4c"];

/* ── STATE ── */
let allData=[], curTab="team", curMet=METRICS[0], mMin=0, mMax=120, selSplit="";
let mci=null, h2ci=null;

/* ── LOAD ── */
function loadData(){
  ss("loading","Refreshing…");
  fetch(API+"&t="+Date.now())
    .then(r=>r.text())
    .then(t=>{
      const js=t.replace(/^\/\*[\s\S]*?\*\/\s*/,"").replace(/^google\.visualization\.Query\.setResponse\(/,"").replace(/\);\s*$/,"");
      allData=pgviz(JSON.parse(js));
      const ts=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
      ss("live",`${allData.length} records · ${ts}`);
      buildSB(); buildEvGrid(); go();
    })
    .catch(e=>{console.error(e);ss("err","Failed to load");});
}
function pgviz(j){
  const cols=j.table.cols.map(c=>(c.label||c.id).trim());
  return j.table.rows.map(row=>{
    const o={};
    cols.forEach((c,i)=>{const cell=row.c?row.c[i]:null;o[c]=(cell&&cell.v!=null)?String(cell.v):"";});
    return o;
  }).filter(r=>Object.values(r).some(v=>v!==""));
}
function ss(st,txt){
  document.getElementById("sTxt").textContent=txt;
  const d=document.getElementById("sDot");
  d.className="dot"+(st==="live"?" live":st==="loading"?" loading":"");
}

/* ── SIDEBAR ── */
function buildSB(){buildMet();buildSD();buildPC();buildPosC();buildSq();buildAB();}

function buildMet(){
  const s=document.getElementById("metSel"),prev=s.value;
  s.innerHTML="";
  METRICS.forEach(m=>{const o=document.createElement("option");o.value=o.text=m;s.appendChild(o);});
  if(prev&&METRICS.includes(prev))s.value=prev;
}

function buildSD(){
  const splits=[...new Set(allData.map(d=>d["Split Name"]).filter(Boolean))].sort();
  const list=document.getElementById("sdList");
  const items=[{v:"",l:"All splits"},...splits.map(s=>({v:s,l:s}))];
  list.innerHTML=items.map(it=>`<div class="sd-item${it.v===selSplit?" active":""}" onmousedown="sdPick('${it.v.replace(/'/g,"\\'")}','${it.l.replace(/'/g,"\\'")}')">${it.l}</div>`).join("");
}
function sdToggle(){document.getElementById("sdList").classList.toggle("open");}
function sdClose(){setTimeout(()=>document.getElementById("sdList").classList.remove("open"),180);}
function sdPick(v,l){selSplit=v;document.getElementById("sdInp").value=v?l:"";document.getElementById("sdList").classList.remove("open");go();}

function buildPC(){
  const players=[...new Set(allData.map(d=>d["Player Full Name"]).filter(Boolean))].sort();
  rpItems(players,new Set(players));
}
function rpItems(players,checked){
  document.getElementById("pList").innerHTML=players.map(p=>`
    <label class="ck-item">
      <input type="checkbox" class="pcb" value="${p}" ${checked.has(p)?"checked":""} onchange="go()">
      <span>${p}</span>
    </label>`).join("");
}
function filterP(q){
  const all=[...new Set(allData.map(d=>d["Player Full Name"]).filter(Boolean))].sort();
  const ck=gck("pcb");
  rpItems(all.filter(p=>!q||p.toLowerCase().includes(q.toLowerCase())),ck);
}

function buildPosC(){
  const pos=[...new Set(allData.map(d=>d["Position"]).filter(Boolean))].sort();
  document.getElementById("posList").innerHTML=pos.map(p=>`
    <label class="ck-item">
      <input type="checkbox" class="poscb" value="${p}" checked onchange="go()">
      <span>${p}</span>
    </label>`).join("");
}

function buildSq(){
  const s=document.getElementById("sqSel"),prev=s.value;
  s.innerHTML='<option value="">All squads</option>';
  [...new Set(allData.map(d=>d["Squad"]).filter(Boolean))].sort()
    .forEach(v=>{const o=document.createElement("option");o.value=o.text=v;s.appendChild(o);});
  if(prev)s.value=prev;
}

function buildAB(){
  const ps=[...new Set(allData.map(d=>d["Player Full Name"]).filter(Boolean))].sort();
  ["pA","pB"].forEach((id,i)=>{
    const s=document.getElementById(id),prev=s.value;
    s.innerHTML="";
    ps.forEach(v=>{const o=document.createElement("option");o.value=o.text=v;s.appendChild(o);});
    if(prev)s.value=prev;
    else if(i===1&&ps.length>1)s.selectedIndex=1;
  });
}

/* ── EVENT GRID ── */
function getEvs(){
  const seen=new Map();
  allData.forEach(d=>{
    const id=d["Event ID"];
    if(!id||seen.has(id))return;
    const tag=(d["Tags"]||"").toLowerCase().trim();
    seen.set(id,{id,tag,date:d["Date"]||""});
  });
  return [...seen.values()].sort((a,b)=>a.date.localeCompare(b.date));
}
function buildEvGrid(){renderEvItems(getEvs(),null);}
function renderEvItems(evs,checked){
  const wrap=document.getElementById("evGrid");
  const cur=gck("ecb");
  wrap.innerHTML=evs.map(ev=>{
    const isC=checked?checked.has(ev.id):(cur.size===0||cur.has(ev.id));
    const bc=ev.tag==="game"?"ev-g":ev.tag==="training"?"ev-t":"";
    const bt=ev.tag==="game"?"G":ev.tag==="training"?"T":"";
    return `<label class="ev-chip">
      <input type="checkbox" class="ecb" value="${ev.id}" ${isC?"checked":""} onchange="go()">
      <span>${ev.id}</span>
      ${ev.date?`<span class="ev-date">${ev.date}</span>`:""}
      ${bt?`<span class="ev-tag ${bc}">${bt}</span>`:""}
    </label>`;
  }).join("");
}
function filterEv(q){
  renderEvItems(getEvs().filter(ev=>!q||ev.id.toLowerCase().includes(q.toLowerCase())||ev.date.includes(q)),gck("ecb"));
}

/* ── HELPERS ── */
function gck(cls){return new Set([...document.querySelectorAll(`.${cls}:checked`)].map(c=>c.value));}
function ckAll(cls,v){document.querySelectorAll(`.${cls}`).forEach(c=>{c.checked=v;});go();}
function onMet(){curMet=document.getElementById("metSel").value;go();}
function onDr(){
  let a=+document.getElementById("drMin").value,b=+document.getElementById("drMax").value;
  if(a>b){const t=a;a=b;b=t;}
  mMin=a;mMax=b;
  document.getElementById("drLbl").textContent=`${a} – ${b} min`;
  const p1=(a/120)*100,p2=(b/120)*100;
  document.getElementById("drFill").style.cssText=`left:${p1}%;width:${p2-p1}%`;
  go();
}

/* ── TAB ── */
const TLBL={team:"TEAM",player:"PLAYER",tracking:"TEAM TRACKING",h2h:"HEAD TO HEAD"};
function setTab(t,btn){
  curTab=t;
  document.querySelectorAll(".tbtn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  document.getElementById("vhd").textContent=TLBL[t];
  document.getElementById("h2hSec").style.display=t==="h2h"?"":"none";
  document.getElementById("evPanel").style.display=t==="tracking"?"":"none";
  document.getElementById("h2hPanels").style.display=t==="h2h"?"":"none";
  document.getElementById("rkPanel").style.display=t==="h2h"?"none":"";
  document.getElementById("mainPanel").style.display=t==="h2h"?"none":"";
  go();
}

/* ── FILTER ── */
function filt(){
  const sq=document.getElementById("sqSel").value;
  const ckP=gck("pcb");
  const ckPos=gck("poscb");
  const ckEv=curTab==="tracking"?gck("ecb"):null;
  return allData.filter(d=>{
    const mins=Number(d["Mins Played"]);
    return (!selSplit||d["Split Name"]===selSplit)
      &&(!sq||d["Squad"]===sq)
      &&(ckPos.size===0||ckPos.has(d["Position"]))
      &&(ckP.size===0||ckP.has(d["Player Full Name"]))
      &&(ckEv===null||ckEv.size===0||ckEv.has(d["Event ID"]))
      &&mins>=mMin&&mins<=mMax;
  });
}

/* ── MAIN ── */
function go(){
  const data=filt();
  drawSum(data);
  const ev=new Set(data.map(d=>d["Event ID"])).size;
  const pp=new Set(data.map(d=>d["Player Full Name"])).size;
  document.getElementById("vsub").textContent=`${pp} players · ${ev} events`;
  if(curTab==="team")drawTeam(data);
  else if(curTab==="player")drawPlayer(data);
  else if(curTab==="tracking")drawTracking(data);
  else drawH2H(data);
}

/* ── SUMMARY ── */
function drawSum(data){
  if(!data.length){document.getElementById("sumCards").innerHTML="";return;}
  const vals=data.map(d=>+d[curMet]).filter(v=>!isNaN(v)&&isFinite(v));
  if(!vals.length)return;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const max=Math.max(...vals);
  const pp=new Set(data.map(d=>d["Player Full Name"])).size;
  const ev=new Set(data.map(d=>d["Event ID"])).size;
  document.getElementById("sumCards").innerHTML=`
    <div class="sc"><div class="sc-lbl">Squad Avg</div><div class="sc-val">${avg.toFixed(1)}</div><div class="sc-sub">${curMet.replace(/ \(.*?\)/g,"")}</div></div>
    <div class="sc"><div class="sc-lbl">Peak</div><div class="sc-val">${max.toFixed(1)}</div><div class="sc-sub">best session</div></div>
    <div class="sc"><div class="sc-lbl">Players</div><div class="sc-val">${pp}</div><div class="sc-sub">in view</div></div>
    <div class="sc"><div class="sc-lbl">Events</div><div class="sc-val">${ev}</div><div class="sc-sub">in view</div></div>`;
}

/* ── TEAM ── */
function drawTeam(data){
  const evs=[...new Set(data.map(d=>d["Event ID"]))].sort();
  document.getElementById("cTitle").textContent=`Squad Average — ${curMet}`;
  document.getElementById("cTag").textContent=`${evs.length} events`;
  document.getElementById("cLeg").innerHTML=`
    <span class="li"><span class="ld" style="background:#FFE500;border:1px solid #ccc"></span>Squad Avg</span>
    <span class="li"><span class="ld" style="background:#06d6a055;border:1px solid #06d6a0"></span>Max</span>
    <span class="li"><span class="ld" style="background:#ef476f55;border:1px solid #ef476f"></span>Min</span>`;
  const avg=evs.map(id=>{const rs=data.filter(d=>d["Event ID"]===id);return +(rs.reduce((s,d)=>s+ +d[curMet],0)/rs.length).toFixed(2);});
  const maxV=evs.map(id=>+Math.max(...data.filter(d=>d["Event ID"]===id).map(d=>+d[curMet])).toFixed(2));
  const minV=evs.map(id=>+Math.min(...data.filter(d=>d["Event ID"]===id).map(d=>+d[curMet])).toFixed(2));
  document.getElementById("cWrap").style.height="320px";
  if(mci)mci.destroy();
  mci=new Chart(document.getElementById("mc"),{
    type:"bar",
    data:{labels:evs,datasets:[
      {label:"Squad avg",data:avg,backgroundColor:"#FFE500",borderRadius:4,borderSkipped:false},
      {label:"Max",data:maxV,backgroundColor:"#06d6a033",borderColor:"#06d6a0",borderWidth:1,borderRadius:4},
      {label:"Min",data:minV,backgroundColor:"#ef476f33",borderColor:"#ef476f",borderWidth:1,borderRadius:4}
    ]},
    options:co({maxRotation:45,autoSkip:evs.length>10})
  });
  drawRk(data);
}

/* ── PLAYER ── */
function drawPlayer(data){
  const pm={};
  data.forEach(d=>{pm[d["Player Full Name"]]=(pm[d["Player Full Name"]]||[]).concat(+d[curMet]);});
  const ps=Object.entries(pm).map(([n,v])=>({n,avg:v.reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>b.avg-a.avg);
  document.getElementById("cTitle").textContent=`Player Rankings — ${curMet}`;
  document.getElementById("cTag").textContent=`${ps.length} players`;
  document.getElementById("cLeg").innerHTML="";
  const h=Math.max(300,ps.length*38+80);
  document.getElementById("cWrap").style.height=h+"px";
  if(mci)mci.destroy();
  mci=new Chart(document.getElementById("mc"),{
    type:"bar",
    data:{labels:ps.map(p=>p.n),datasets:[{label:"Avg",data:ps.map(p=>+p.avg.toFixed(2)),backgroundColor:ps.map((_,i)=>PAL[i%PAL.length]),borderRadius:4}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:tt()},
      scales:{x:{ticks:{font:{size:11},color:"#777"},grid:{color:"rgba(0,0,0,0.04)"},border:{display:false}},
              y:{ticks:{font:{size:12},color:"#444"},grid:{display:false},border:{display:false}}}}
  });
  drawRk(data);
}

/* ── TEAM TRACKING ── */
function drawTracking(data){
  const evs=[...new Set(data.map(d=>d["Event ID"]))].sort((a,b)=>{
    const da=allData.find(x=>x["Event ID"]===a)?.Date||"";
    const db=allData.find(x=>x["Event ID"]===b)?.Date||"";
    return da.localeCompare(db);
  });
  document.getElementById("cTitle").textContent=`Team Average — ${curMet} per Event`;
  document.getElementById("cTag").textContent=`${evs.length} events`;
  const avgPE=evs.map(id=>{
    const rs=data.filter(d=>d["Event ID"]===id);
    if(!rs.length)return null;
    const v=rs.map(d=>+d[curMet]).filter(v=>!isNaN(v));
    return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):null;
  });
  document.getElementById("cLeg").innerHTML=`<span class="li"><span class="ld" style="background:var(--black)"></span>Squad avg</span>`;
  document.getElementById("cWrap").style.height="340px";
  if(mci)mci.destroy();

  // Register inline data-label plugin
  const dlPlugin={
    id:"dl",
    afterDatasetsDraw(chart){
      const {ctx,scales:{x,y}}=chart;
      chart.data.datasets[0].data.forEach((val,i)=>{
        if(val===null)return;
        const xp=x.getPixelForValue(i),yp=y.getPixelForValue(val);
        ctx.save();
        ctx.font="600 11px 'DM Mono',monospace";
        ctx.fillStyle="#1a1a1a";
        ctx.textAlign="center";
        ctx.textBaseline="bottom";
        ctx.fillText(val.toFixed(1),xp,yp-9);
        ctx.restore();
      });
    }
  };

  mci=new Chart(document.getElementById("mc"),{
    type:"line",
    data:{labels:evs,datasets:[{
      label:"Squad avg",data:avgPE,
      borderColor:"#111",backgroundColor:"rgba(17,17,17,0.05)",
      borderWidth:2.5,pointRadius:7,
      pointBackgroundColor:"#FFE500",pointBorderColor:"#111",pointBorderWidth:2,
      pointHoverRadius:9,tension:0.3,fill:true,spanGaps:true
    }]},
    plugins:[dlPlugin],
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:tt()},
      scales:{
        x:{ticks:{font:{size:11,family:"'DM Sans'"},color:"#555",maxRotation:45,autoSkip:evs.length>14},grid:{color:"rgba(0,0,0,0.05)"},border:{display:false}},
        y:{ticks:{font:{size:11},color:"#777"},grid:{color:"rgba(0,0,0,0.05)"},border:{display:false}}
      }
    }
  });
  drawRk(data);
}

/* ── H2H ── */
function drawH2H(data){
  const a=document.getElementById("pA").value,b=document.getElementById("pB").value;
  if(!a||!b){document.getElementById("h2hTbl").innerHTML='<div class="empty"><div class="ei">👥</div>Select Player A and B in the sidebar</div>';return;}
  const rows=METRICS.map(m=>{
    const av=data.filter(d=>d["Player Full Name"]===a).map(d=>+d[m]).filter(v=>!isNaN(v));
    const bv=data.filter(d=>d["Player Full Name"]===b).map(d=>+d[m]).filter(v=>!isNaN(v));
    const A=av.length?av.reduce((s,v)=>s+v,0)/av.length:0;
    const B=bv.length?bv.reduce((s,v)=>s+v,0)/bv.length:0;
    return{m,A,B};
  });
  const af=a.split(" ")[0],bf=b.split(" ")[0];
  document.getElementById("h2hTbl").innerHTML=`
    <div class="h2r" style="border-bottom:2px solid var(--border)">
      <div class="h2hd">Metric</div>
      <div class="h2hd" style="text-align:right;color:var(--ink)">${af}</div>
      <div class="h2hd" style="text-align:right">${bf}</div>
    </div>`+
    rows.map(r=>{
      const mx=Math.max(r.A,r.B,.01);
      const pA=(r.A/mx*100).toFixed(1),pB=(r.B/mx*100).toFixed(1);
      return `<div class="h2r">
        <div>
          <div class="h2m">${r.m.replace(/ \(.*?\)/g,"")}</div>
          <div class="h2brow"><div class="h2ba" style="width:${pA}%;min-width:2px"></div><div class="h2bb" style="width:${pB}%;min-width:2px"></div></div>
        </div>
        <div class="h2v ${r.A>=r.B?"h2w":""}" style="text-align:right">${r.A.toFixed(1)}</div>
        <div class="h2v ${r.B>r.A?"h2w":""}" style="text-align:right">${r.B.toFixed(1)}</div>
      </div>`;
    }).join("");
  document.getElementById("h2hCTitle").textContent=`${af} vs ${bf}`;
  if(h2ci)h2ci.destroy();
  h2ci=new Chart(document.getElementById("h2hC"),{
    type:"bar",
    data:{
      labels:rows.map(r=>r.m.replace(/ \(.*?\)/g,"")),
      datasets:[
        {label:af,data:rows.map(r=>+r.A.toFixed(2)),backgroundColor:"#FFE500",borderRadius:4},
        {label:bf,data:rows.map(r=>+r.B.toFixed(2)),backgroundColor:"#1a1a1a",borderRadius:4}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:12,family:"'DM Sans'"},color:"#444"},position:"top"},tooltip:tt()},
      scales:{
        x:{ticks:{font:{size:10,family:"'DM Sans'"},color:"#555",maxRotation:30},grid:{display:false},border:{display:false}},
        y:{ticks:{font:{size:11},color:"#777"},grid:{color:"rgba(0,0,0,0.05)"},border:{display:false}}
      }
    }
  });
  drawRk(data);
}

/* ── RANK ── */
function drawRk(data){
  const pm={};
  data.forEach(d=>{pm[d["Player Full Name"]]=(pm[d["Player Full Name"]]||[]).concat(+d[curMet]);});
  const ps=Object.entries(pm).map(([n,v])=>({n,avg:v.filter(x=>!isNaN(x)).reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>b.avg-a.avg);
  const mx=Math.max(...ps.map(p=>p.avg),1);
  document.getElementById("rkPanel").innerHTML=
    `<div class="phd"><div class="pt">Player Rankings — ${curMet}</div></div>`+
    (ps.length?ps.map((p,i)=>`<div class="rr"><span class="rn">${i+1}</span><span class="rnm" title="${p.n}">${p.n}</span><div class="rbw"><div class="rb" style="width:${(p.avg/mx*100).toFixed(1)}%;background:${PAL[i%PAL.length]}"></div></div><span class="rv">${p.avg.toFixed(1)}</span></div>`).join("")
    :`<div class="empty"><div class="ei">📊</div>No data</div>`);
}

/* ── CHART HELPERS ── */
function co(xEx={}){
  return{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:tt()},
    scales:{
      x:{ticks:{font:{size:11,family:"'DM Sans'"},color:"#555",...xEx},grid:{color:"rgba(0,0,0,0.04)"},border:{display:false}},
      y:{ticks:{font:{size:11},color:"#777"},grid:{color:"rgba(0,0,0,0.04)"},border:{display:false}}
    }};
}
function tt(){return{backgroundColor:"#111",titleColor:"#FFE500",bodyColor:"#f0f0f0",padding:10,cornerRadius:6};}

/* ── INIT ── */
document.getElementById("drFill").style.cssText="left:0%;width:100%";
document.addEventListener("click",e=>{
  if(!e.target.closest("#sdWrap"))document.getElementById("sdList").classList.remove("open");
});
loadData();
setInterval(loadData,5*60*1000);
</script>
</body>
</html>
