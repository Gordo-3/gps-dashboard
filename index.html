<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Performance Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --yellow: #FFE500;
      --yellow-dim: #FFE50022;
      --yellow-mid: #FFE50066;
      --black: #0a0a0a;
      --black2: #111111;
      --black3: #1a1a1a;
      --black4: #222222;
      --grey1: #2a2a2a;
      --grey2: #333333;
      --grey3: #555555;
      --grey4: #888888;
      --grey5: #aaaaaa;
      --white: #f5f5f5;
      --white-dim: #f5f5f520;
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body: 'Barlow', sans-serif;
      --radius: 4px;
      --radius-lg: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .site-header {
      background: var(--black2);
      border-bottom: 2px solid var(--yellow);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-header img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }
    .site-header .title-block { flex: 1; }
    .site-header h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--yellow);
      line-height: 1;
      text-transform: uppercase;
    }
    .site-header .subtitle {
      font-size: 11px;
      color: var(--grey4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--black3);
      border: 1px solid var(--grey2);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      color: var(--grey4);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--grey3);
      transition: background 0.3s;
    }
    .status-dot.live { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }
    .status-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--grey2);
      color: var(--grey4);
      padding: 6px 14px;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.15s;
    }
    .refresh-btn:hover { border-color: var(--yellow); color: var(--yellow); }

    /* ── LAYOUT ── */
    .main { padding: 1.5rem 2rem 3rem; max-width: 1400px; margin: 0 auto; }

    /* ── FILTER PANEL ── */
    .filter-panel {
      background: var(--black2);
      border: 1px solid var(--grey2);
      border-left: 3px solid var(--yellow);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .filter-panel-title {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 1rem;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .filter-row + .filter-row {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--grey2);
    }
    .fg {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 140px;
      flex: 1;
    }
    .fg.fg-fixed { flex: 0 0 auto; }
    .fg label {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grey4);
    }

    /* Searchable dropdown wrapper */
    .search-select-wrap { position: relative; }
    .search-select-wrap input {
      width: 100%;
      background: var(--black3);
      border: 1px solid var(--grey2);
      border-radius: var(--radius);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 7px 28px 7px 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .search-select-wrap input:focus { outline: none; border-color: var(--yellow); }
    .search-select-wrap .arrow {
      position: absolute;
      right: 9px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--grey3);
      font-size: 10px;
    }
    .dropdown-list {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--black3);
      border: 1px solid var(--yellow);
      border-radius: var(--radius);
      max-height: 220px;
      overflow-y: auto;
      z-index: 200;
      scrollbar-width: thin;
      scrollbar-color: var(--grey2) transparent;
    }
    .dropdown-list.open { display: block; }
    .dropdown-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--grey1);
      transition: background 0.1s;
      line-height: 1.3;
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover, .dropdown-item.focused { background: var(--grey1); }
    .dropdown-item.selected { color: var(--yellow); }
    .dropdown-item .item-sub { font-size: 11px; color: var(--grey4); margin-top: 1px; }

    /* Standard select */
    select {
      background: var(--black3);
      border: 1px solid var(--grey2);
      border-radius: var(--radius);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 7px 10px;
      width: 100%;
      cursor: pointer;
      transition: border-color 0.15s;
      appearance: none;
    }
    select:focus { outline: none; border-color: var(--yellow); }
    select option { background: var(--black3); }

    /* Type badge */
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      align-self: flex-end;
      margin-bottom: 1px;
    }
    .badge-game { background: #185fa522; border: 1px solid #185fa5; color: #5ab0ff; }
    .badge-training { background: #0f6e5622; border: 1px solid #0f6e56; color: #4cd4aa; }
    .badge-all { background: var(--grey1); border: 1px solid var(--grey2); color: var(--grey4); }

    /* View toggle */
    .view-toggle { display: flex; gap: 0; border: 1px solid var(--grey2); border-radius: var(--radius); overflow: hidden; }
    .vbtn {
      flex: 1; padding: 7px 10px;
      font-family: var(--font-display);
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: transparent; color: var(--grey4);
      border: none; border-right: 1px solid var(--grey2);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .vbtn:last-child { border-right: none; }
    .vbtn:hover { background: var(--grey1); color: var(--white); }
    .vbtn.active { background: var(--yellow); color: var(--black); }

    /* Dual range slider */
    .dual-range-wrap { position: relative; height: 36px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
    .dual-range-track { position: relative; height: 4px; background: var(--grey2); border-radius: 2px; margin: 0 6px; }
    .dual-range-fill { position: absolute; height: 100%; background: var(--yellow); border-radius: 2px; }
    .dual-range-wrap input[type=range] {
      position: absolute; top: -8px; left: 0; right: 0; width: 100%;
      -webkit-appearance: none; appearance: none;
      background: transparent; border: none; padding: 0;
      pointer-events: none; height: 20px;
    }
    .dual-range-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--yellow); border: 2px solid var(--black);
      cursor: pointer; pointer-events: all;
      box-shadow: 0 0 4px #0006;
    }
    .dual-range-wrap input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--yellow); border: 2px solid var(--black);
      cursor: pointer; pointer-events: all;
    }
    .range-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--grey4); }

    /* Player checkbox list */
    .player-check-list {
      background: var(--black3);
      border: 1px solid var(--grey2);
      border-radius: var(--radius);
      max-height: 160px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--grey2) transparent;
    }
    .player-check-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-bottom: 1px solid var(--grey1);
      cursor: pointer; transition: background 0.1s; font-size: 13px;
    }
    .player-check-item:last-child { border-bottom: none; }
    .player-check-item:hover { background: var(--grey1); }
    .player-check-item input[type=checkbox] { accent-color: var(--yellow); width: 13px; height: 13px; cursor: pointer; }
    .check-all-row {
      display: flex; gap: 8px; margin-bottom: 5px;
    }
    .check-all-btn {
      font-size: 11px; padding: 3px 10px;
      background: transparent; border: 1px solid var(--grey2);
      border-radius: var(--radius); color: var(--grey4);
      cursor: pointer; font-family: var(--font-display);
      font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .check-all-btn:hover { border-color: var(--yellow); color: var(--yellow); }

    /* ── SUMMARY CARDS ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .summary-card {
      background: var(--black2);
      border: 1px solid var(--grey2);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--yellow);
    }
    .summary-card .card-label {
      font-family: var(--font-display);
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--grey4); margin-bottom: 6px;
    }
    .summary-card .card-value {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 800;
      color: var(--yellow); line-height: 1;
    }
    .summary-card .card-sub {
      font-size: 11px; color: var(--grey4); margin-top: 4px;
    }

    /* ── PANELS ── */
    .panel {
      background: var(--black2);
      border: 1px solid var(--grey2);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .panel-title {
      font-family: var(--font-display);
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--grey5);
    }
    .panel-tag {
      font-family: var(--font-display);
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--grey3);
    }

    /* ── CHART ── */
    .chart-container {
      position: relative;
      width: 100%;
      height: 300px;
    }

    /* ── LEGEND ── */
    .legend {
      display: flex; flex-wrap: wrap;
      gap: 10px; margin-bottom: 10px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--grey5);
      cursor: pointer; transition: opacity 0.15s;
    }
    .legend-item:hover { opacity: 0.7; }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px; flex-shrink: 0;
    }

    /* ── RANK ROWS ── */
    .rank-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--grey1);
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num {
      font-family: var(--font-display);
      font-size: 12px; font-weight: 700;
      color: var(--grey3); width: 18px; flex-shrink: 0;
    }
    .rank-name {
      font-size: 13px; color: var(--white);
      width: 120px; flex-shrink: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rank-bar-wrap {
      flex: 1; height: 5px;
      background: var(--grey1); border-radius: 3px; overflow: hidden;
    }
    .rank-bar { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
    .rank-val {
      font-family: var(--font-display);
      font-size: 13px; font-weight: 600;
      color: var(--yellow); min-width: 48px; text-align: right;
    }

    /* ── TWO COL ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    /* ── COMPARE TABLE ── */
    .compare-header-row {
      display: grid; grid-template-columns: 1fr 72px 72px;
      gap: 6px; padding: 4px 0 8px;
      font-family: var(--font-display);
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--grey3);
      border-bottom: 1px solid var(--grey2);
      margin-bottom: 4px;
    }
    .compare-header-row span { text-align: right; }
    .compare-header-row span:first-child { text-align: left; }
    .compare-row {
      display: grid; grid-template-columns: 1fr 72px 72px;
      gap: 6px; padding: 5px 0;
      border-bottom: 1px solid var(--grey1);
      font-size: 12px;
    }
    .compare-row:last-child { border-bottom: none; }
    .cm { color: var(--grey4); font-size: 11px; align-self: center; }
    .ca, .cb { text-align: right; font-weight: 600; color: var(--grey3); align-self: center; font-family: var(--font-display); font-size: 13px; }
    .cwin { color: var(--yellow) !important; }

    /* ── EMPTY STATE ── */
    .empty {
      padding: 2.5rem; text-align: center;
      font-size: 13px; color: var(--grey3);
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.4; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .main { padding: 1rem; }
      .site-header { padding: 0 1rem; }
      .filter-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <img src="Logo.png" alt="Club Logo" onerror="this.style.display='none'">
  <div class="title-block">
    <h1>GPS Performance Dashboard</h1>
    <div class="subtitle">Catapult · Match &amp; Training Data</div>
  </div>
  <div class="status-pill">
    <div class="status-dot loading" id="statusDot"></div>
    <span id="statusTxt">Loading…</span>
  </div>
  <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
</header>

<main class="main">

  <!-- FILTER PANEL -->
  <div class="filter-panel">
    <div class="filter-panel-title">Filters</div>

    <!-- Row 1: Event + Split + Badge -->
    <div class="filter-row">
      <div class="fg" style="flex:2;min-width:200px">
        <label>Event ID</label>
        <div class="search-select-wrap" id="eventWrap">
          <input type="text" id="eventSearch" placeholder="Search or select event…" autocomplete="off" readonly>
          <span class="arrow">▾</span>
          <div class="dropdown-list" id="eventDropdown"></div>
        </div>
      </div>
      <div class="fg" style="flex:1.5;min-width:160px">
        <label>Split Name</label>
        <div class="search-select-wrap" id="splitWrap">
          <input type="text" id="splitSearch" placeholder="All splits…" autocomplete="off" readonly>
          <span class="arrow">▾</span>
          <div class="dropdown-list" id="splitDropdown"></div>
        </div>
      </div>
      <div id="typeBadge" class="type-badge badge-all">All Sessions</div>
    </div>

    <!-- Row 2: Metric + Squad/Position + View mode -->
    <div class="filter-row">
      <div class="fg" style="min-width:160px;max-width:200px">
        <label>Metric</label>
        <select id="metricSelect" onchange="onMetricChange()"></select>
      </div>
      <div class="fg" style="min-width:120px;max-width:160px">
        <label>Squad</label>
        <select id="squadFilter" onchange="updateAll()">
          <option value="">All squads</option>
        </select>
      </div>
      <div class="fg" style="min-width:120px;max-width:160px">
        <label>Position</label>
        <select id="positionFilter" onchange="updateAll()">
          <option value="">All positions</option>
        </select>
      </div>
      <div class="fg fg-fixed" style="min-width:220px">
        <label>View</label>
        <div class="view-toggle">
          <button class="vbtn active" onclick="setMode('team',this)">Team</button>
          <button class="vbtn" onclick="setMode('player',this)">Player</button>
          <button class="vbtn" onclick="setMode('compare',this)">Compare</button>
        </div>
      </div>
    </div>

    <!-- Row 3: Dual minutes slider + player checkboxes (compare) + player A/B (compare) -->
    <div class="filter-row">
      <div class="fg" style="min-width:220px;max-width:340px">
        <label>Minutes Played: <span id="minsLabel">0 – 120 min</span></label>
        <div class="dual-range-wrap">
          <div class="dual-range-track">
            <div class="dual-range-fill" id="rangeFill"></div>
          </div>
          <input type="range" id="minsMin" min="0" max="120" value="0" step="1" oninput="onDualSlider()">
          <input type="range" id="minsMax" min="0" max="120" value="120" step="1" oninput="onDualSlider()">
        </div>
      </div>

      <div class="fg" id="ctrl-pa" style="display:none;min-width:140px">
        <label>Player A</label>
        <select id="playerA" onchange="updateAll()"></select>
      </div>
      <div class="fg" id="ctrl-pb" style="display:none;min-width:140px">
        <label>Player B</label>
        <select id="playerB" onchange="updateAll()"></select>
      </div>
    </div>
  </div>

  <!-- PLAYER CHECKBOX PANEL (compare mode) -->
  <div class="panel" id="playerCheckPanel" style="display:none">
    <div class="panel-header">
      <div class="panel-title">Include Players in Squad Average</div>
      <div class="check-all-row">
        <button class="check-all-btn" onclick="checkAll(true)">All</button>
        <button class="check-all-btn" onclick="checkAll(false)">None</button>
      </div>
    </div>
    <div class="player-check-list" id="playerCheckList"></div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="summary-grid" id="summaryCards"></div>

  <!-- MAIN CHART PANEL -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title" id="chartTitle">Loading…</div>
      <div class="panel-tag" id="chartTag"></div>
    </div>
    <div class="legend" id="chartLegend"></div>
    <div class="chart-container" id="chartContainer">
      <canvas id="chart" role="img" aria-label="Performance chart"></canvas>
    </div>
  </div>

  <!-- RANK + COMPARE -->
  <div class="two-col">
    <div class="panel" id="rankPanel">
      <div class="panel-title" style="margin-bottom:1rem" id="rankTitle">Rankings</div>
    </div>
    <div class="panel" id="comparePanel" style="display:none">
      <div class="panel-title" style="margin-bottom:1rem">Head to Head</div>
      <div id="compareContent"></div>
    </div>
  </div>

  <!-- RADAR (compare mode) -->
  <div class="panel" id="radarPanel" style="display:none">
    <div class="panel-header">
      <div class="panel-title">All Metrics Comparison</div>
    </div>
    <div class="chart-container">
      <canvas id="radar" role="img" aria-label="Radar chart"></canvas>
    </div>
  </div>

</main>

<script>
/* ═══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const SHEET_ID = "1NjflNGpLnBaQfV0NXtILRT7X7Uz7ILMEPrJu5U4R2qc";
const SHEET_GID = "0"; // Change this if GPS tab is not the first sheet (check URL in Google Sheets for gid=XXXXX)
const API = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=GPS`;

const METRICS = [
  "Distance (km)",
  "HSR (m)",
  "Sprint Distance (m)",
  "Work Rate (m/min)",
  "Top Speed (km/h)",
  "Hard Accelerations (#)",
  "Hard Decelerations (#)"
];

const COLORS = [
  "#FFE500","#5ab0ff","#4cd4aa","#ff6b6b",
  "#c084fc","#fb923c","#34d399","#f472b6",
  "#a3e635","#60a5fa","#facc15","#f87171"
];

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let allData = [];
let currentMetric = METRICS[0];
let displayMode = "team";
let minsMin = 0, minsMax = 120;
let selectedEvent = "";
let selectedSplit = "";
let mainChart, radarChart;

/* ═══════════════════════════════════════════════
   LOAD DATA
═══════════════════════════════════════════════ */
function loadData() {
  setStatus("loading", "Refreshing…");
  fetch(API + "&t=" + Date.now())
    .then(r => r.text())
    .then(csv => {
      allData = parseCSV(csv);
      const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      setStatus("live", `${allData.length} records · ${ts}`);
      buildUI();
      updateAll();
    })
    .catch(e => {
      console.error(e);
      setStatus("error", "Failed to load — check sheet is public");
    });
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  // Parse header row - handle quoted fields with commas
  const headers = parseCSVRow(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseCSVRow(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] || "").trim(); });
    return obj;
  }).filter(row => Object.values(row).some(v => v !== ""));
}

function parseCSVRow(line) {
  const result = [];
  let cur = "", inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if (ch === ',' && !inQuote) {
      result.push(cur); cur = "";
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function setStatus(state, txt) {
  document.getElementById("statusTxt").textContent = txt;
  const dot = document.getElementById("statusDot");
  dot.className = "status-dot" + (state === "live" ? " live" : state === "loading" ? " loading" : "");
}

/* ═══════════════════════════════════════════════
   BUILD UI ELEMENTS
═══════════════════════════════════════════════ */
function buildUI() {
  buildMetricSelect();
  buildSearchableDropdown("eventWrap", "eventSearch", "eventDropdown", getEventOptions(), onEventPick, "All events");
  buildSquadFilter();
  buildPositionFilter();
  buildPlayerSelects();
  buildPlayerCheckList();
  buildSplitDropdown();
}

function buildMetricSelect() {
  const s = document.getElementById("metricSelect");
  s.innerHTML = "";
  METRICS.forEach(m => { const o = document.createElement("option"); o.value = o.text = m; s.appendChild(o); });
}

function getEventOptions() {
  const seen = new Map();
  allData.forEach(d => {
    const id = d["Event ID"];
    if (!id || seen.has(id)) return;
    const tag = (d["Tags"] || "").toLowerCase().trim();
    seen.set(id, { value: id, label: id, sub: d["Date"] || "", tag });
  });
  return [...seen.values()].sort((a, b) => a.sub.localeCompare(b.sub));
}

function buildSplitDropdown(eventId) {
  let options = [{ value: "", label: "All splits", sub: "" }];
  if (eventId) {
    const splits = [...new Set(allData.filter(d => d["Event ID"] === eventId).map(d => d["Split Name"]).filter(Boolean))];
    splits.forEach(s => options.push({ value: s, label: s, sub: "" }));
  }
  buildSearchableDropdown("splitWrap", "splitSearch", "splitDropdown", options, onSplitPick, "All splits");
}

function buildSquadFilter() {
  const s = document.getElementById("squadFilter");
  s.innerHTML = '<option value="">All squads</option>';
  [...new Set(allData.map(d => d["Squad"]).filter(Boolean))].sort()
    .forEach(v => { const o = document.createElement("option"); o.value = o.text = v; s.appendChild(o); });
}

function buildPositionFilter() {
  const s = document.getElementById("positionFilter");
  s.innerHTML = '<option value="">All positions</option>';
  [...new Set(allData.map(d => d["Position"]).filter(Boolean))].sort()
    .forEach(v => { const o = document.createElement("option"); o.value = o.text = v; s.appendChild(o); });
}

function buildPlayerSelects() {
  const players = [...new Set(allData.map(d => d["Player Full Name"]).filter(Boolean))].sort();
  ["playerA", "playerB"].forEach(id => {
    const s = document.getElementById(id);
    s.innerHTML = "";
    players.forEach(v => { const o = document.createElement("option"); o.value = o.text = v; s.appendChild(o); });
    if (players.length > 1 && id === "playerB") s.selectedIndex = 1;
  });
}

function buildPlayerCheckList() {
  const players = [...new Set(allData.map(d => d["Player Full Name"]).filter(Boolean))].sort();
  const list = document.getElementById("playerCheckList");
  list.innerHTML = players.map(p => `
    <label class="player-check-item">
      <input type="checkbox" class="player-cb" value="${p}" checked onchange="updateAll()">
      ${p}
    </label>`).join("");
}

function checkAll(val) {
  document.querySelectorAll(".player-cb").forEach(cb => { cb.checked = val; });
  updateAll();
}

function checkedPlayers() {
  return [...document.querySelectorAll(".player-cb:checked")].map(cb => cb.value);
}

/* ═══════════════════════════════════════════════
   SEARCHABLE DROPDOWN
═══════════════════════════════════════════════ */
function buildSearchableDropdown(wrapId, inputId, listId, options, onPick, placeholder) {
  const wrap = document.getElementById(wrapId);
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  wrap._options = options;
  wrap._onPick = onPick;
  wrap._selected = "";

  input.placeholder = placeholder;
  input.value = "";
  input.readOnly = false;

  renderDropdownItems(list, options, wrap._selected, onPick, input);

  input.onclick = () => { list.classList.toggle("open"); renderDropdownItems(list, filterOpts(wrap._options, input.value), wrap._selected, onPick, input); };
  input.oninput = () => { list.classList.add("open"); renderDropdownItems(list, filterOpts(wrap._options, input.value), wrap._selected, onPick, input); };
  input.onblur = () => setTimeout(() => list.classList.remove("open"), 180);
  input.onkeydown = e => {
    const items = list.querySelectorAll(".dropdown-item");
    let focused = list.querySelector(".dropdown-item.focused");
    let idx = focused ? [...items].indexOf(focused) : -1;
    if (e.key === "ArrowDown") { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); items.forEach(i => i.classList.remove("focused")); if (items[idx]) items[idx].classList.add("focused"); }
    if (e.key === "ArrowUp") { e.preventDefault(); idx = Math.max(idx - 1, 0); items.forEach(i => i.classList.remove("focused")); if (items[idx]) items[idx].classList.add("focused"); }
    if (e.key === "Enter" && focused) { focused.click(); }
    if (e.key === "Escape") list.classList.remove("open");
  };
}

function filterOpts(options, query) {
  if (!query) return options;
  const q = query.toLowerCase();
  return options.filter(o => o.label.toLowerCase().includes(q) || (o.sub || "").toLowerCase().includes(q));
}

function renderDropdownItems(list, options, selected, onPick, input) {
  list.innerHTML = options.map(o => `
    <div class="dropdown-item${o.value === selected ? " selected" : ""}" data-value="${o.value}">
      ${o.label}${o.sub ? `<div class="item-sub">${o.sub}</div>` : ""}
    </div>`).join("");
  list.querySelectorAll(".dropdown-item").forEach(item => {
    item.addEventListener("mousedown", e => {
      e.preventDefault();
      const val = item.dataset.value;
      input.value = val ? options.find(o => o.value === val)?.label || "" : "";
      list.classList.remove("open");
      onPick(val);
    });
  });
}

function setDropdownValue(wrapId, inputId, listId, value) {
  const wrap = document.getElementById(wrapId);
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  wrap._selected = value;
  const opt = wrap._options?.find(o => o.value === value);
  input.value = opt ? opt.label : "";
  renderDropdownItems(list, wrap._options || [], value, wrap._onPick, input);
}

/* ═══════════════════════════════════════════════
   EVENT / SPLIT HANDLERS
═══════════════════════════════════════════════ */
function onEventPick(val) {
  selectedEvent = val;
  selectedSplit = "";
  buildSplitDropdown(val);
  setDropdownValue("splitWrap", "splitSearch", "splitDropdown", "");

  const badge = document.getElementById("typeBadge");
  if (val) {
    const rows = allData.filter(d => d["Event ID"] === val);
    const tag = (rows[0]?.["Tags"] || "").toLowerCase().trim();
    if (tag === "game") { badge.className = "type-badge badge-game"; badge.textContent = "⚽ Game"; }
    else if (tag === "training") { badge.className = "type-badge badge-training"; badge.textContent = "🏃 Training"; }
    else { badge.className = "type-badge badge-all"; badge.textContent = tag || "Session"; }
  } else {
    badge.className = "type-badge badge-all"; badge.textContent = "All Sessions";
  }
  updateAll();
}

function onSplitPick(val) {
  selectedSplit = val;
  updateAll();
}

function onMetricChange() { currentMetric = document.getElementById("metricSelect").value; updateAll(); }

/* ═══════════════════════════════════════════════
   DUAL SLIDER
═══════════════════════════════════════════════ */
function onDualSlider() {
  let a = +document.getElementById("minsMin").value;
  let b = +document.getElementById("minsMax").value;
  if (a > b) { const tmp = a; a = b; b = tmp; }
  minsMin = a; minsMax = b;
  document.getElementById("minsLabel").textContent = `${a} – ${b} min`;
  const pct1 = (a / 120) * 100;
  const pct2 = (b / 120) * 100;
  document.getElementById("rangeFill").style.left = pct1 + "%";
  document.getElementById("rangeFill").style.width = (pct2 - pct1) + "%";
  updateAll();
}

function setMode(mode, btn) {
  displayMode = mode;
  document.querySelectorAll(".vbtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const isCompare = mode === "compare";
  document.getElementById("ctrl-pa").style.display = isCompare ? "" : "none";
  document.getElementById("ctrl-pb").style.display = isCompare ? "" : "none";
  document.getElementById("comparePanel").style.display = isCompare ? "" : "none";
  document.getElementById("radarPanel").style.display = isCompare ? "" : "none";
  document.getElementById("playerCheckPanel").style.display = isCompare ? "" : "none";
  updateAll();
}

/* ═══════════════════════════════════════════════
   FILTER DATA
═══════════════════════════════════════════════ */
function filtered() {
  const squad = document.getElementById("squadFilter").value;
  const pos = document.getElementById("positionFilter").value;
  return allData.filter(d => {
    const mins = Number(d["Mins Played"]);
    return (!selectedEvent || d["Event ID"] === selectedEvent)
      && (!selectedSplit || d["Split Name"] === selectedSplit)
      && (!squad || d["Squad"] === squad)
      && (!pos || d["Position"] === pos)
      && mins >= minsMin && mins <= minsMax;
  });
}

function filteredWithPlayers(data) {
  if (displayMode !== "compare") return data;
  const checked = checkedPlayers();
  return data.filter(d => checked.includes(d["Player Full Name"]));
}

/* ═══════════════════════════════════════════════
   UPDATE ALL
═══════════════════════════════════════════════ */
function updateAll() {
  const data = filtered();
  drawSummary(data);
  if (displayMode === "compare") drawCompareView(data);
  else if (displayMode === "player") drawPlayerView(data);
  else drawTeamView(data);
}

/* ═══════════════════════════════════════════════
   SUMMARY CARDS
═══════════════════════════════════════════════ */
function drawSummary(data) {
  if (!data.length) { document.getElementById("summaryCards").innerHTML = ""; return; }
  const vals = data.map(d => +d[currentMetric]).filter(v => !isNaN(v) && isFinite(v));
  if (!vals.length) return;
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const max = Math.max(...vals);
  const players = new Set(data.map(d => d["Player Full Name"])).size;
  const events = new Set(data.map(d => d["Event ID"])).size;
  document.getElementById("summaryCards").innerHTML = `
    <div class="summary-card">
      <div class="card-label">Squad Avg · ${currentMetric.replace(/ \(.*?\)/g, "")}</div>
      <div class="card-value">${avg.toFixed(1)}</div>
      <div class="card-sub">${events} event${events !== 1 ? "s" : ""} in view</div>
    </div>
    <div class="summary-card">
      <div class="card-label">Peak</div>
      <div class="card-value">${max.toFixed(1)}</div>
      <div class="card-sub">best single session</div>
    </div>
    <div class="summary-card">
      <div class="card-label">Players</div>
      <div class="card-value">${players}</div>
      <div class="card-sub">in current view</div>
    </div>
    <div class="summary-card">
      <div class="card-label">Records</div>
      <div class="card-value">${data.length}</div>
      <div class="card-sub">after filters</div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════
   TEAM VIEW
═══════════════════════════════════════════════ */
function drawTeamView(data) {
  const events = [...new Set(data.map(d => d["Event ID"]))].sort();
  document.getElementById("chartTitle").textContent = `Squad Average — ${currentMetric}`;
  document.getElementById("chartTag").textContent = `${events.length} events`;

  const avg = events.map(id => {
    const rs = data.filter(d => d["Event ID"] === id);
    return +(rs.reduce((s, d) => s + +d[currentMetric], 0) / rs.length).toFixed(2);
  });
  const maxV = events.map(id => +Math.max(...data.filter(d => d["Event ID"] === id).map(d => +d[currentMetric])).toFixed(2));
  const minV = events.map(id => +Math.min(...data.filter(d => d["Event ID"] === id).map(d => +d[currentMetric])).toFixed(2));

  document.getElementById("chartLegend").innerHTML = `
    <span class="legend-item"><span class="legend-dot" style="background:#FFE500"></span>Squad Avg</span>
    <span class="legend-item"><span class="legend-dot" style="background:#4cd4aa55;border:1px solid #4cd4aa"></span>Max</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ff6b6b55;border:1px solid #ff6b6b"></span>Min</span>`;

  document.getElementById("chartContainer").style.height = "300px";
  if (mainChart) mainChart.destroy();
  mainChart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: events,
      datasets: [
        { label: "Squad avg", data: avg, backgroundColor: "#FFE500", borderRadius: 3 },
        { label: "Max", data: maxV, backgroundColor: "#4cd4aa33", borderColor: "#4cd4aa", borderWidth: 1, borderRadius: 3 },
        { label: "Min", data: minV, backgroundColor: "#ff6b6b33", borderColor: "#ff6b6b", borderWidth: 1, borderRadius: 3 }
      ]
    },
    options: chartOpts({ maxRotation: 45, autoSkip: events.length > 12 })
  });
  drawRankPanel(data);
}

/* ═══════════════════════════════════════════════
   PLAYER VIEW
═══════════════════════════════════════════════ */
function drawPlayerView(data) {
  const pmap = {};
  data.forEach(d => { pmap[d["Player Full Name"]] = (pmap[d["Player Full Name"]] || []).concat(+d[currentMetric]); });
  const players = Object.entries(pmap)
    .map(([name, vals]) => ({ name, avg: vals.reduce((a, b) => a + b, 0) / vals.length }))
    .sort((a, b) => b.avg - a.avg);

  document.getElementById("chartTitle").textContent = `Player Rankings — ${currentMetric}`;
  document.getElementById("chartTag").textContent = `${players.length} players`;
  document.getElementById("chartLegend").innerHTML = "";

  const h = Math.max(300, players.length * 38 + 80);
  document.getElementById("chartContainer").style.height = h + "px";

  if (mainChart) mainChart.destroy();
  mainChart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: players.map(p => p.name),
      datasets: [{ label: "Avg", data: players.map(p => +p.avg.toFixed(2)), backgroundColor: players.map((_, i) => COLORS[i % COLORS.length]), borderRadius: 3 }]
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { font: { size: 11 }, color: "#888" }, grid: { color: "rgba(255,255,255,0.05)" } },
        y: { ticks: { font: { size: 12 }, color: "#aaa" }, grid: { display: false } }
      }
    }
  });

  const maxV = Math.max(...players.map(p => p.avg), 1);
  document.getElementById("rankPanel").innerHTML = `
    <div class="panel-title" style="margin-bottom:1rem" id="rankTitle">Rankings — ${currentMetric}</div>` +
    players.map((p, i) => `
      <div class="rank-row">
        <span class="rank-num">${i + 1}</span>
        <span class="rank-name" title="${p.name}">${p.name}</span>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(p.avg / maxV * 100).toFixed(1)}%;background:${COLORS[i % COLORS.length]}"></div></div>
        <span class="rank-val">${p.avg.toFixed(1)}</span>
      </div>`).join("");
}

/* ═══════════════════════════════════════════════
   COMPARE VIEW — team avg line per event
═══════════════════════════════════════════════ */
function drawCompareView(data) {
  const included = filteredWithPlayers(data);
  const events = [...new Set(data.map(d => d["Event ID"]))].sort();

  // Build one dataset per metric showing team avg across events
  // X axis = Event IDs, Y = squad avg for that metric in that event
  // But we show selected metric prominently + allow multi-event comparison
  const avgPerEvent = events.map(id => {
    const rs = included.filter(d => d["Event ID"] === id);
    if (!rs.length) return null;
    return +(rs.reduce((s, d) => s + +d[currentMetric], 0) / rs.length).toFixed(2);
  });

  document.getElementById("chartTitle").textContent = `Team Average per Event — ${currentMetric}`;
  document.getElementById("chartTag").textContent = `${events.length} events · ${checkedPlayers().length} players`;
  document.getElementById("chartLegend").innerHTML = `<span class="legend-item"><span class="legend-dot" style="background:#FFE500"></span>Team Avg (selected players)</span>`;

  document.getElementById("chartContainer").style.height = "300px";
  if (mainChart) mainChart.destroy();
  mainChart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: events,
      datasets: [{
        label: "Team avg",
        data: avgPerEvent,
        borderColor: "#FFE500",
        backgroundColor: "#FFE50022",
        borderWidth: 2,
        pointRadius: 5,
        pointBackgroundColor: "#FFE500",
        pointBorderColor: "#0a0a0a",
        pointBorderWidth: 2,
        tension: 0.3,
        fill: true,
        spanGaps: true
      }]
    },
    options: chartOpts({ maxRotation: 45, autoSkip: events.length > 10 })
  });

  drawRankPanel(included);
  drawComparePanel(included);
}

/* ═══════════════════════════════════════════════
   RANK PANEL
═══════════════════════════════════════════════ */
function drawRankPanel(data) {
  const pmap = {};
  data.forEach(d => { pmap[d["Player Full Name"]] = (pmap[d["Player Full Name"]] || []).concat(+d[currentMetric]); });
  const players = Object.entries(pmap)
    .map(([name, vals]) => ({ name, avg: vals.filter(v => !isNaN(v)).reduce((a, b) => a + b, 0) / vals.length }))
    .sort((a, b) => b.avg - a.avg);
  const maxV = Math.max(...players.map(p => p.avg), 1);
  document.getElementById("rankPanel").innerHTML = `
    <div class="panel-title" style="margin-bottom:1rem">Rankings — ${currentMetric}</div>` +
    (players.length ? players.map((p, i) => `
      <div class="rank-row">
        <span class="rank-num">${i + 1}</span>
        <span class="rank-name" title="${p.name}">${p.name}</span>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(p.avg / maxV * 100).toFixed(1)}%;background:${COLORS[i % COLORS.length]}"></div></div>
        <span class="rank-val">${p.avg.toFixed(1)}</span>
      </div>`).join("") : `<div class="empty"><div class="empty-icon">📊</div>No data for current filters</div>`);
}

/* ═══════════════════════════════════════════════
   COMPARE PANEL (head to head)
═══════════════════════════════════════════════ */
function drawComparePanel(data) {
  const a = document.getElementById("playerA").value;
  const b = document.getElementById("playerB").value;
  const panel = document.getElementById("compareContent");
  if (!a || !b) { panel.innerHTML = '<div class="empty"><div class="empty-icon">👥</div>Select Player A and B above</div>'; return; }

  const rows = METRICS.map(m => {
    const A = data.filter(d => d["Player Full Name"] === a).reduce((s, d) => s + +d[m], 0);
    const B = data.filter(d => d["Player Full Name"] === b).reduce((s, d) => s + +d[m], 0);
    return { m, A, B };
  });

  const aFirst = a.split(" ")[0];
  const bFirst = b.split(" ")[0];

  panel.innerHTML = `
    <div class="compare-header-row">
      <span>Metric</span><span>${aFirst}</span><span>${bFirst}</span>
    </div>` +
    rows.map(r => `
      <div class="compare-row">
        <span class="cm">${r.m}</span>
        <span class="ca ${r.A >= r.B ? "cwin" : ""}">${r.A.toFixed(1)}</span>
        <span class="cb ${r.B > r.A ? "cwin" : ""}">${r.B.toFixed(1)}</span>
      </div>`).join("");

  drawRadar(rows, a, b);
}

/* ═══════════════════════════════════════════════
   RADAR
═══════════════════════════════════════════════ */
function drawRadar(rows, a, b) {
  const mx = rows.map(r => Math.max(r.A, r.B, 1));
  const aN = rows.map((r, i) => +(r.A / mx[i] * 100).toFixed(1));
  const bN = rows.map((r, i) => +(r.B / mx[i] * 100).toFixed(1));
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(document.getElementById("radar"), {
    type: "radar",
    data: {
      labels: rows.map(r => r.m.replace(/ \(.*?\)/g, "")),
      datasets: [
        { label: a, data: aN, borderColor: "#FFE500", backgroundColor: "#FFE50022", borderWidth: 2, pointRadius: 3, pointBackgroundColor: "#FFE500" },
        { label: b, data: bN, borderColor: "#5ab0ff", backgroundColor: "#5ab0ff22", borderWidth: 2, pointRadius: 3, pointBackgroundColor: "#5ab0ff" }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 12 }, color: "#aaa" } } },
      scales: {
        r: {
          ticks: { display: false, backdropColor: "transparent" },
          grid: { color: "rgba(255,255,255,0.07)" },
          angleLines: { color: "rgba(255,255,255,0.07)" },
          pointLabels: { font: { size: 11, family: "'Barlow Condensed', sans-serif", weight: "600" }, color: "#888" }
        }
      }
    }
  });
}

/* ═══════════════════════════════════════════════
   CHART OPTIONS HELPER
═══════════════════════════════════════════════ */
function chartOpts(xTickExtra = {}) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: {
        ticks: { font: { size: 11, family: "'Barlow Condensed', sans-serif" }, color: "#888", ...xTickExtra },
        grid: { color: "rgba(255,255,255,0.04)" }
      },
      y: {
        ticks: { font: { size: 11 }, color: "#888" },
        grid: { color: "rgba(255,255,255,0.04)" }
      }
    }
  };
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
// Init range fill
document.getElementById("rangeFill").style.left = "0%";
document.getElementById("rangeFill").style.width = "100%";

// Close dropdowns on outside click
document.addEventListener("click", e => {
  if (!e.target.closest(".search-select-wrap")) {
    document.querySelectorAll(".dropdown-list").forEach(d => d.classList.remove("open"));
  }
});

loadData();
setInterval(loadData, 5 * 60 * 1000); // auto-refresh every 5 min
</script>
